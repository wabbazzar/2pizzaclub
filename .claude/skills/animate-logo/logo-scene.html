<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
 *{margin:0;padding:0;box-sizing:border-box;font-family:'Quicksand',sans-serif;}
 html,body{width:1080px;height:1080px;background:transparent;overflow:hidden;}
 #stage{position:relative;width:1080px;height:1080px;display:flex;flex-direction:column;
   align-items:center;justify-content:center;}
 #logoWrap{position:relative;width:560px;height:560px;will-change:transform,opacity,filter;}
 #logo{width:100%;height:100%;}
 /* RGB-split ghosts for the glitch preset */
 .ghost{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:screen;opacity:0;}
 #gr{filter:url(#none);}
 #wm{margin-top:30px;color:#FFF8E7;font-weight:700;font-size:104px;letter-spacing:2px;opacity:0;will-change:transform,opacity;}
 #wm b{color:#FFD93D;}
 #url{margin-top:8px;color:#FFF8E7;opacity:0;font-weight:600;font-size:40px;letter-spacing:4px;will-change:transform,opacity;}
 .spk{position:absolute;border-radius:50%;background:#FFD93D;opacity:0;}
 #flash{position:absolute;inset:-200px;background:#FFF8E7;opacity:0;pointer-events:none;}
 #puddle{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);width:0;height:0;opacity:0;}
 #puddle .p1{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:100%;height:100%;background:#FFD93D;border-radius:50%;}
 #puddle .p2{position:absolute;left:34%;top:50%;transform:translate(-50%,-50%);width:38%;height:55%;background:#1B3FB5;border-radius:50%;}
 #puddle .p3{position:absolute;left:68%;top:48%;transform:translate(-50%,-50%);width:26%;height:44%;background:#E63946;border-radius:50%;}
 .drip{position:absolute;width:34px;border-radius:18px;opacity:0;}
</style></head>
<body><div id="stage">
 <div id="logoWrap">
   <img id="logo" src="%%LOGO%%">
   <img class="ghost" id="gr" src="%%LOGO%%">
   <img class="ghost" id="gb" src="%%LOGO%%">
   <div class="spk" style="width:28px;height:28px;left:-14px;top:100px"></div>
   <div class="spk" style="width:18px;height:18px;left:545px;top:155px"></div>
   <div class="spk" style="width:34px;height:34px;left:505px;top:470px"></div>
   <div class="spk" style="width:16px;height:16px;left:20px;top:500px"></div>
   <div class="spk" style="width:22px;height:22px;left:270px;top:-16px"></div>
 </div>
 <div id="puddle"><div class="p1"></div><div class="p2"></div><div class="p3"></div></div>
 <div class="drip" style="left:392px;background:#FFD93D"></div>
 <div class="drip" style="left:472px;background:#1B3FB5"></div>
 <div class="drip" style="left:540px;background:#E63946"></div>
 <div class="drip" style="left:608px;background:#1B3FB5"></div>
 <div class="drip" style="left:678px;background:#FFD93D"></div>
 <div id="wm"><b>2</b>pizzaclub</div>
 <div id="url">2PIZZACLUB.COM</div>
 <div id="flash"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a,b)=>Math.max(a,Math.min(b,x));
const eOutCubic=p=>1-Math.pow(1-p,3);
const eInCubic=p=>p*p*p;
const eOutBack=(p,s=1.70158)=>{const c3=s+1;return 1+c3*Math.pow(p-1,3)+s*Math.pow(p-1,2);};
const eOutElastic=p=>{if(p<=0)return 0;if(p>=1)return 1;const c4=(2*Math.PI)/3;return Math.pow(2,-10*p)*Math.sin((p*10-0.75)*c4)+1;};
const eOutBounce=p=>{const n=7.5625,d=2.75;if(p<1/d)return n*p*p;if(p<2/d){p-=1.5/d;return n*p*p+.75;}if(p<2.5/d){p-=2.25/d;return n*p*p+.9375;}p-=2.625/d;return n*p*p+.984375;};

const PRESETS = {
 // p = progress of the main reveal (0..1); helpers below reset transforms each frame
 bounce(t){ const p=cl(t/0.9,0,1); set({sc:0.2+0.8*eOutBack(p,2.2), rot:(1-eOutCubic(p))*-18, op:cl(t/0.25,0,1)}); lock(t,1.0); },
 spray(t){ const p=cl(t/0.95,0,1); set({sc:0.2+0.8*eOutBack(p), rot:(1-eOutCubic(p))*-22, op:cl(t/0.3,0,1), mask:p*108}); speck(t,0.35); lock(t,1.1); },
 wipe(t){ const p=cl(t/0.85,0,1); const w=eOutCubic(p)*112; set({op:1, clip:`inset(0 ${112-w}% 0 0)`, sc:0.96+0.04*p}); lock(t,1.0); },
 iris(t){ const p=cl(t/0.8,0,1); set({op:1, mask:eOutCubic(p)*112, sc:0.9+0.1*eOutBack(p,1.3)}); lock(t,0.95); },
 drop(t){ const p=cl(t/1.05,0,1); const y=(1-eOutBounce(p))*-620; const sq=p<0.85?1:1; set({ty:y, sc:1, op:cl(t/0.15,0,1)}); lock(t,1.15); },
 spin(t){ const p=cl(t/1.0,0,1); set({sc:0.3+0.7*eOutBack(p,1.4), rot:(1-eOutCubic(p))*360, op:cl(t/0.25,0,1)}); lock(t,1.1); },
 glitch(t){ const p=cl(t/0.7,0,1); const settle=t>0.7; const j=settle?0:(Math.sin(t*90)*14*(1-p)); set({op:cl(t/0.12,0,1), sc:0.9+0.1*p, tx:j}); glitchGhosts(t); lock(t,0.85); },
 stamp(t){ const p=cl(t/0.5,0,1); const sc=1.5-0.5*eOutCubic(p); const sh=t>0.5?Math.sin(t*70)*6*Math.max(0,1-(t-0.5)/0.35):0; set({sc:sc+(t>0.5?0:0), tx:sh, op:cl(t/0.1,0,1)}); if(t>0.45&&t<0.75)$('flash').style.opacity=cl(1-(t-0.45)/0.3,0,1)*0.85; else $('flash').style.opacity=0; lock(t,0.95); },
 // — melt family: logo appears, then melts into the bottom of the frame —
 melt_slump(t){
  const i=cl(t/0.7,0,1);                       // pop in
  const m=cl((t-1.3)/1.9,0,1);                 // melt progress
  const me=eInCubic(m);
  const sy=1-0.88*me, sx=1+0.5*me;
  const wob=(t>0.7&&t<1.3)?Math.sin(t*18)*1.5:0;
  set({op:t<3.0?cl(t/0.25,0,1):cl(1-(t-3.0)/0.45,0,1),
       ty:me*175,
       sc:(0.2+0.8*eOutBack(i))*sx, sy:(0.2+0.8*eOutBack(i))*sy,
       org:'center bottom', rot:wob, blur:me*7});
  puddle(cl((t-1.9)/1.2,0,1), cl((t-4.0)/0.6,0,1));
  lock(t,3.3);
 },
 melt_drip(t){
  const i=cl(t/0.7,0,1);
  const m=cl((t-1.2)/2.1,0,1);
  const k=100-90*eInCubic(m);                  // visible from top to k%
  const img=$('logo');
  set({op:cl(t/0.25,0,1)*(m>=1?cl(1-(t-3.4)/0.3,0,1):1), sc:0.2+0.8*eOutBack(i), sy:(0.2+0.8*eOutBack(i))*(1-0.18*eInCubic(m)), org:'center bottom'});
  const lm=`linear-gradient(#000 0%, #000 ${k.toFixed(1)}%, transparent ${(k+9).toFixed(1)}%)`;
  img.style.webkitMaskImage=lm; img.style.maskImage=lm;
  document.querySelectorAll('.drip').forEach((d,j)=>{
    const dp=cl((t-(1.35+j*0.22))/1.3,0,1);
    if(dp<=0||dp>=1){d.style.opacity=0;return;}
    d.style.opacity=Math.min(1,dp*4)*(1-eInCubic(dp)*0.25);
    const fall=eInCubic(dp)*520, stretch=40+dp*210;
    d.style.top=`${640+fall}px`; d.style.height=`${stretch}px`;
  });
  puddle(cl((t-1.8)/1.5,0,1), cl((t-4.0)/0.6,0,1));
  lock(t,3.4);
 },
 // dropout: melt_slide's drop-in + wiggle, text rises, then the whole lockup
 // exits out the bottom — text first, logo right behind (with a tiny pre-hop).
 dropout(t){
  const i=cl(t/0.75,0,1);                                  // bounce in from above
  const wob=(t>0.75&&t<1.5)?Math.sin((t-0.75)*16)*3*(1-(t-0.75)/0.75):0;
  const pre=cl((t-3.0)/0.14,0,1);                          // anticipation hop
  const ex=cl((t-3.16)/0.5,0,1);                           // logo exit fall
  set({op:1, sc:1, rot:wob,
       ty:(1-eOutBounce(i))*-620 - 30*Math.sin(pre*Math.PI) + eInCubic(ex)*1200});
  lock(t,1.1);
  // text drops out first, url a beat behind the wordmark
  const w1=cl((t-2.84)/0.42,0,1), w2=cl((t-2.92)/0.42,0,1);
  if(w1>0){
    $('wm').style.transform=`translateY(${eInCubic(w1)*950}px)`;
    $('url').style.transform=`translateY(${eInCubic(w2)*950}px)`;
  }
 },
 melt_slide(t){
  const i=cl(t/0.75,0,1);
  const m=cl((t-1.5)/1.6,0,1);
  const me=eInCubic(m);
  const wob=(t>0.75&&t<1.5)?Math.sin((t-0.75)*16)*3*(1-(t-0.75)/0.75):0;
  set({op:cl(t/0.2,0,1)*(1-cl((t-2.85)/0.25,0,1)),
       ty:(1-eOutBounce(i))*-620 + me*760,
       sc:1-0.32*me, sy:(1)*(1+0.9*me),
       rot:wob, blur:me*10, org:'center top'});
  puddle(cl((t-2.55)/0.55,0,1)*1.0, cl((t-4.0)/0.6,0,1), true);
  lock(t,3.2);
 },
};

function puddle(g, fade, splash){
 const p=$('puddle');
 if(g<=0){p.style.opacity=0;return;}
 const w=(splash?760:680)*eOutBack(cl(g,0,1),1.6), h=Math.max(10,(splash?120:104)*eOutBack(cl(g,0,1),1.6));
 p.style.width=`${Math.max(0,w)}px`; p.style.height=`${Math.max(0,h)}px`;
 p.style.opacity=Math.min(1,g*3)*(1-cl(fade,0,1));
}

function set(o){
 const w=$('logoWrap'), img=$('logo');
 w.style.opacity=o.op??1;
 const sx=o.sc??1, sy=o.sy??(o.sc??1);
 w.style.transformOrigin=o.org||'center';
 w.style.filter=o.blur?`blur(${o.blur}px)`:'none';
 w.style.transform=`translate(${o.tx||0}px,${o.ty||0}px) scale(${sx},${sy}) rotate(${o.rot||0}deg)`;
 img.style.clipPath=o.clip||'none';
 if(o.mask!=null){const m=`radial-gradient(circle at 50% 48%, #000 0%, #000 ${o.mask.toFixed(1)}%, transparent ${(o.mask+9).toFixed(1)}%)`;img.style.webkitMaskImage=m;img.style.maskImage=m;}
 else {img.style.webkitMaskImage='none';img.style.maskImage='none';}
}
function speck(t,start){ document.querySelectorAll('.spk').forEach((s,i)=>{const sp=cl((t-(start+i*0.07))/0.3,0,1);s.style.opacity=sp*0.9;s.style.transform=`scale(${0.4+0.6*eOutBack(sp)})`;}); }
function glitchGhosts(t){ const a=t<0.7?(Math.sin(t*120)*0.5+0.5)*(1-t/0.7):0; const gr=$('gr'),gb=$('gb'); gr.style.opacity=a*0.6;gb.style.opacity=a*0.6; gr.style.transform=`translate(${a*22}px,0)`;gr.style.filter='hue-rotate(-40deg) saturate(3)'; gb.style.transform=`translate(${-a*22}px,0)`;gb.style.filter='hue-rotate(150deg) saturate(3)'; }
function lock(t,start){ // wordmark + url rise after the logo lands
 const wp=cl((t-start)/0.5,0,1), up=cl((t-(start+0.2))/0.5,0,1);
 $('wm').style.opacity=wp; $('wm').style.transform=`translateY(${(1-eOutBack(wp))*54}px)`;
 $('url').style.opacity=up; $('url').style.transform=`translateY(${(1-eOutCubic(up))*30}px)`;
}

let PRESET='spray';
window.setPreset=(name)=>{ PRESET=name in PRESETS?name:'spray'; if(PRESET!=='glitch'){$('gr').style.opacity=0;$('gb').style.opacity=0;} if(PRESET!=='stamp')$('flash').style.opacity=0; if(!PRESET.startsWith('melt')){$('puddle').style.opacity=0;document.querySelectorAll('.drip').forEach(d=>d.style.opacity=0);} };
window.render=(t)=>{ // reset speck/mask each frame for non-spray
  if(PRESET!=='spray') document.querySelectorAll('.spk').forEach(s=>s.style.opacity=0);
  PRESETS[PRESET](t);
};
window.__ready=true;
</script></body></html>
