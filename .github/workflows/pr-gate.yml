name: pr-gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pr-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: RAG index, RAG eval, bundle
        run: |
          (cd tools && npm ci)
          node tools/build-rag-index.mjs
          node tools/rag-eval.mjs
          node tools/build-bundle.mjs
