# 2pizzaclub agent install config
# Read by ~/code/shipyard/agents/scribe/runner.sh via
# the shared lib/load-config.sh path. Project-specific knobs only; the generic
# scribe runner + role.md live in the shipyard hub.
#
# Only scribe is installed here. 2pizzaclub is a no-build static site (plain
# HTML/CSS/ES modules, GitHub Pages, custom domain 2pizzaclub.com) — there is
# no test/typecheck/service surface for release/build/medic to act on.

project_name  = "2pizzaclub"
project_dir   = "/home/wabbazzar/code/2pizzaclub"
project_owner = "wabbazzar"
branch        = "main"

[install.timers]
# OnCalendar written verbatim into ~/.config/systemd/user/2pizzaclub-scribe.timer.
# 01:00 local matches the other projects' quiet-hours window.
scribe = "*-*-* 01:00:00"

[paths]
result_dir = "tmp"   # gitignored; runner writes 2pizzaclub-scribe-result.json here

[scribe]
# Scribe's ONLY surface here is the pre-rendered cinema share cards under
# gallery/share/. It re-runs tools/share-pages.mjs to keep each theme's card
# (video count + total runtime) in sync with the live captures/evidence data,
# and the runner commits the gallery/share/ diff. content_paths is deliberately
# narrow: scribe must never stage sources/captures/ or evidence (other agents'
# territory — a mid-ingest capture could be swept into a pathspec commit).
content_paths          = ["gallery/share/"]
wall_clock_sec         = 900
commit_message_prefix  = "scribe: refresh share cards"
auto_commit            = true
auto_push              = true
allow_prose_rewrites   = false
allow_file_moves       = false
forbid_file_deletion   = false   # the generator prunes share dirs for removed themes
forbid_ticket_creation = true

[names]
design = "mentat"
build = "helldiver"
release = "proctor"
medic = "suk"
scribe = "chronicler"

[write_ticket]
# Read before drafting: root context, the evidence-record schema, the ingest
# SOP, and the verification gate file (media QC + data-artifact gates live
# there, not in any test suite).
context_files   = ["CLAUDE.md", "sources/SCHEMA.md", "tools/INGEST-SOP.md", ".agents/gates.md"]
ticket_dir      = "docs/tickets/"        # new tickets land here (dir created on first ticket)
scan_dirs       = ["docs/tickets/"]      # scan for next id
types           = ["feature", "bug", "refactor", "chore", "docs"]
id_width        = 3                      # docs/tickets/XXX_<type>_<short_desc>.md
point_scale     = [1, 2, 3, 5, 8]
phase_point_cap = 5
viewport        = "390x844"              # mobile-first: mobile-nav activates <=880px; site ships as a PWA
# The only automated gate + the two data-artifact rebuilds. Media QC and site
# render checks are command recipes in .agents/gates.md, not one-shot cmds.
test_cmds       = [
  "node tools/build-rag-index.mjs && node tools/rag-eval.mjs",
  "node tools/build-bundle.mjs",
]
house_rules     = """
NO Claude attribution in commits — no Co-Authored-By, no Generated-with footer \
(explicit project policy; overrides any global default). \
Multiple agents share main: never branch, stage explicit paths only (never \
`git add -A`), pull --rebase before push, never force-push. \
No build step: plain HTML/CSS/ES modules on GitHub Pages — no bundler, no \
framework, no transpile; do not introduce one. \
Reader-facing text (claims, blurbs, headers) must pass the four-check quality \
bar in CLAUDE.md — flat voice, no source-video references, acronyms glossed, \
attributed not adopted. \
Any record claim/quote change requires rebuilding + committing rag-index.json \
(eval 5/5) and bundle.json. \
Produced audio/video gets whole-file QC (ebur128 per-segment + silencedetect + \
interior/ending transcription) before any preview or publish; live IG posts are \
a hard human gate — explicit sign-off, never replace/delete a live post.\
"""

[[medic.checks]]
# Crew-install drift: doctor audits what this install owns (units, foreign
# drop-ins, retired config keys, dead hooks, skill symlinks). Read-only, <1s.
# Notify-only — remediation is uninstall+reinstall or a stamped ticket, never
# a medic reflex.
name        = "crew-install-drift"
cmd         = 'bash "$QUARTET_DIR/install.sh" --doctor --project .'
timeout_sec = 30
